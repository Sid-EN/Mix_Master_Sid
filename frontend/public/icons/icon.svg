<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#0A0A0F"/>
  <!-- Martini glass stem -->
  <rect x="246" y="300" width="20" height="100" rx="4" fill="#F5A623"/>
  <!-- Martini glass base -->
  <rect x="196" y="390" width="120" height="16" rx="8" fill="#F5A623"/>
  <!-- Martini glass bowl -->
  <polygon points="160,160 352,160 272,300 240,300" fill="none" stroke="#F5A623" stroke-width="12" stroke-linejoin="round"/>
  <!-- Liquid -->
  <polygon points="185,190 327,190 272,280 240,280" fill="#F5A623" opacity="0.3"/>
  <!-- Olive pick -->
  <line x1="200" y1="130" x2="320" y2="170" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="130" r="16" fill="#F5A623" opacity="0.7"/>
  <!-- Glow effect -->
  <circle cx="256" cy="220" r="120" fill="#F5A623" opacity="0.05"/>
</svg>
