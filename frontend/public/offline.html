<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5A623" />
  <title>離線 — MixMaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0A0F;
      color: #E0E0E0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: #F5A623;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(245, 166, 35, 0.4);
    }
    .subtitle {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.5rem;
      color: #F5A623;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #999;
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }
    .retry-btn {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: transparent;
      color: #F5A623;
      border: 1px solid #F5A623;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: rgba(245, 166, 35, 0.1);
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.3);
    }
  </style>
</head>
<body>
  <div class="logo">MixMaster</div>
  <div class="subtitle">智慧調酒平台</div>

  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
    <line x1="12" y1="20" x2="12.01" y2="20"/>
  </svg>

  <h1>您目前處於離線狀態</h1>
  <p>You are currently offline</p>
  <p>請連接網路後重試 / Please reconnect and try again</p>

  <button class="retry-btn" onclick="window.location.reload()">重試 / Retry</button>
</body>
</html>
