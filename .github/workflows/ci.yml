name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend:
    name: 後端測試 (pytest)
    runs-on: ubuntu-latest

    # 帳號與同步功能的測試需要真實的 PostgreSQL；
    # 使用服務容器而非 SQLite，以確保與正式環境行為一致（例如 JSONB 欄位）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mixmaster
          POSTGRES_PASSWORD: mixmaster
          POSTGRES_DB: mixmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mixmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://mixmaster:mixmaster@localhost:5432/mixmaster_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check backend tests

      - name: 型別檢查 (mypy)
        run: python -m mypy

      - name: 執行測試與覆蓋率
        run: |
          python -m pytest tests \
            --cov=backend --cov-report=term-missing --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: |
            pytest-report.xml
            coverage.xml
          retention-days: 14

  frontend:
    name: 前端檢查 (型別／lint／單元測試／建置)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝相依
        run: npm ci

      - name: 型別檢查
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: 單元測試
        run: npm test -- --ci --coverage

      - name: 正式建置
        run: npm run build

      - name: 上傳覆蓋率
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  e2e:
    name: 端對端測試 (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mixmaster
          POSTGRES_PASSWORD: mixmaster
          POSTGRES_DB: mixmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mixmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://mixmaster:mixmaster@localhost:5432/mixmaster

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安裝後端相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 安裝前端相依
        run: npm ci
        working-directory: frontend

      - name: 安裝 E2E 工具
        run: npm ci

      - name: 取得 Playwright 瀏覽器版本
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 快取 Playwright 瀏覽器
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 安裝瀏覽器
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 安裝瀏覽器系統相依
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 套用資料庫遷移
        run: python -m alembic upgrade head

      - name: 啟動後端
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: 建置並啟動前端
        working-directory: frontend
        run: |
          npm run build
          npx next start -p 6880 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:6880 && break
            sleep 1
          done

      - name: 執行 E2E
        run: npx playwright test --project=chromium

      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
