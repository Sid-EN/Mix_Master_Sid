name: Deploy to GitHub Pages

# 公開展示版：僅含靜態內容（經典配方、學院、計算器）。
# 帳號、同步、分享、社群與智慧配方引擎需要後端與資料庫，於此版本停用。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署，且不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置靜態版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝相依
        run: npm ci
        working-directory: frontend

      - name: 靜態匯出
        working-directory: frontend
        env:
          # GitHub Pages 的專案站台位於 /<repo> 之下
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # 完整版部署後填入此處，展示版即會顯示前往連結
          NEXT_PUBLIC_FULL_APP_URL: ${{ vars.FULL_APP_URL }}
        run: npm run build:static

      - name: 停用 Jekyll 處理
        # 否則 _next 目錄會因底線開頭而被 Pages 忽略
        run: touch frontend/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
